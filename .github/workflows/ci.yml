name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-slim

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 既定のキャッシュキーはmise.tomlのハッシュのみで、idiomatic_version_file_enable_toolsで読む.node-version（Node.js）とpackage.json（npm）のバージョンが変わっても古いキャッシュが使われるため、両ファイルのハッシュをキーに加える
      # Renovateがmise.lockの更新に対応していないため、mise.lockは使わずにキャッシュキーでバージョンの変更を反映する
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          cache_key: "{{default}}-${{ hashFiles('.node-version', 'package.json') }}"

      - run: npm ci

      - run: npm run check
